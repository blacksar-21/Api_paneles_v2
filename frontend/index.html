<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Api Paneles - Login</title>
</head>

<body>

    <h1>Api Paneles</h1>

    <h2>Iniciar sesión</h2>

    <form id="login-form">

        <div>
            <label for="email">Correo electrónico:</label>
            <input
                type="email"
                id="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <p id="message"></p>

    <script type="module" src="app.js"></script>

</body>
</html>
