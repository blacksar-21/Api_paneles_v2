<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Api Paneles - Estudiante</title>
</head>

<body>

    <h1>Panel de Estudiante</h1>

    <p>Bienvenido al panel de estudiante de Api Paneles.</p>

    <button id="logout-button">
        Cerrar sesión
    </button>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL = "https://stscpsybcrcownfmcmym.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3hQL55nVMwWaQBlocB_UNA_db91X-di";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const { data: { user } } = await supabase.auth.getUser();

if (!user) {
    window.location.href = "index.html";
} else {

    const { data: perfil, error: perfilError } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (perfilError || perfil.role !== "estudiante") {
        window.location.href = "index.html";
    }
}

        const logoutButton = document.getElementById("logout-button");

        logoutButton.addEventListener("click", async () => {

            const { error } = await supabase.auth.signOut();

            if (error) {
                console.error("Error al cerrar sesión:", error);
                return;
            }

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
